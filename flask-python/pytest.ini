[pytest]
# Configuração da suíte do módulo flask-python.
#
# `-p no:cacheprovider` fica fora daqui de propósito: em alguns ambientes
# Windows o cache do pytest emite PytestCacheWarning por corrida de diretório,
# mas desligá-lo globalmente também desliga `--lf` / `--ff`, que são úteis.
# Quem precisar do silêncio passa a flag na linha de comando.

testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Falha alto em aviso que costuma esconder defeito real.
filterwarnings =
    default
    error::pytest.PytestUnraisableExceptionWarning

# `strict-markers` impede marcador com erro de digitação de virar silêncio:
# `@pytest.mark.segurnaca` seria ignorado sem isto, e o teste sairia da
# categoria sem ninguém perceber.
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    unidade: função isolada, sem HTTP e sem disco fora do sandbox
    integracao: exercita rota via test_client, com serviços reais
    seguranca: prova uma proteção (traversal, CSP, CSRF, cabeçalhos)
    robustez: entrada malformada, borda, tipo errado, concorrência
    contrato: acordo entre camadas (CSP × templates, CSS × JS, doc × código)
    regressao: guarda de achado de auditoria confirmado
    lento: leva mais de um segundo; excluir com -m "not lento"
