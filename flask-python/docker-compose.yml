services:
  app:
    build: .
    image: pride-security-flask:latest
    container_name: pride-security-flask
    ports:
      - "5000:5000"
    stdin_open: true
    tty: true
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=development

networks:
  default:
    name: pride-security-network
