{% extends "base.html" %}

{% block title %}Sobre{% endblock %}

{% block content %}
<section class="panel">
    <h2>ℹ️ {{ dados.titulo }}</h2>
    <p>{{ dados.descricao }}</p>
    <p><a href="{{ dados.repositorio }}" target="_blank" rel="noopener noreferrer">🔗 Repositorio oficial</a></p>
</section>

<section class="panel">
    <h3>👥 Equipe</h3>
    <ul>
        {% for integrante in dados.integrantes %}
            <li>{{ integrante.nome }} - {{ integrante.rm }}</li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
